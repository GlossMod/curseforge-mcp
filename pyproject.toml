[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curseforge-mcp"
version = "0.1.0"
description = "Unofficial local stdio MCP server for the CurseForge Core API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
curseforge-mcp = "curseforge_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
